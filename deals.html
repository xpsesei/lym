<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部情报与分类导航 - 全球羊毛站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 顶部导航栏 -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                    🔥 全球羊毛与高价值情报站
                </h1>
                <p class="text-sm text-gray-500 mt-1">情报大厅：多维度分类导航与历史情报分页检索</p>
            </div>
            <nav class="mt-4 sm:mt-0 space-x-4">
                <a href="index.html" class="text-gray-600 hover:text-blue-600 text-sm font-medium">返回首页</a>
                <a href="deals.html" class="text-blue-600 font-semibold text-sm">全部情报与分类</a>
            </nav>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- 🏷️ 醒目的分类导航大板块 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-gray-900 flex items-center gap-2">
                    <span>🏷️</span> 选择情报分类
                </h2>
                <span class="text-xs text-gray-400" id="total-categories-count">实时同步分类</span>
            </div>
            <!-- 分类按钮容器 -->
            <div id="category-nav" class="flex flex-wrap gap-2.5">
                <!-- 动态生成的分类按钮会在这里展示 -->
                <span class="text-xs text-gray-400 py-2">正在加载分类导航...</span>
            </div>
        </div>

        <!-- 当前分类状态与统计 -->
        <div class="mb-4 flex justify-between items-center text-sm text-gray-500 px-1">
            <span id="pagination-info" class="font-medium text-gray-700">正在加载活动数据...</span>
        </div>

        <!-- 动态卡片容器 -->
        <div id="deals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 加载状态 -->
            <div class="col-span-full text-center py-20 text-gray-400">
                <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                正在加载全球情报数据...
            </div>
        </div>

        <!-- 分页按钮栏 -->
        <div id="pagination-nav" class="mt-12 flex justify-center items-center space-x-2">
            <!-- 动态生成分页按钮 -->
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-400">
        <p>Global Deals Auto Collector &copy; 2026 | Powered by GitHub Actions & DeepSeek AI</p>
    </footer>

    <!-- 逻辑脚本 -->
    <script>
        let allDeals = [];
        let currentCategory = '全部';
        let currentPage = 1;
        const pageSize = 9; // 每页显示 9 条卡片

        async function initDealsPage() {
            try {
                const response = await fetch('./data/active_deals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('网络请求失败');
                
                allDeals = await response.json();

                renderCategoryNav();
                renderPage();
            } catch (e) {
                console.error(e);
                document.getElementById('deals-container').innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-xl shadow-sm border border-red-100">
                        <p class="text-red-500 font-medium">数据加载失败</p>
                        <p class="text-xs text-gray-400 mt-1">无法读取 data/active_deals.json，请确认文件是否存在。</p>
                    </div>
                `;
            }
        }

        // 渲染分类导航栏
        function renderCategoryNav() {
            const nav = document.getElementById('category-nav');
            // 提取所有不重复的分类
            const categories = ['全部', ...new Set(allDeals.map(d => d.category).filter(Boolean))];
            
            document.getElementById('total-categories-count').innerText = `共 ${categories.length - 1} 个活跃分类`;

            nav.innerHTML = categories.map(cat => {
                const count = cat === '全部' ? allDeals.length : allDeals.filter(d => d.category === cat).length;
                const isActive = cat === currentCategory;
                
                return `
                    <button onclick="switchCategory('${cat}')" 
                        class="cat-btn px-4 py-2 text-xs font-semibold rounded-lg shadow-sm transition-all flex items-center gap-1.5 ${
                            isActive 
                                ? 'bg-blue-600 text-white shadow-blue-100 ring-2 ring-blue-600 ring-offset-2' 
                                : 'bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200'
                        }">
                        <span>${cat}</span>
                        <span class="px-1.5 py-0.5 rounded-md text-[10px] ${isActive ? 'bg-blue-700 text-white' : 'bg-white text-gray-500 border border-gray-200'}">${count}</span>
                    </button>
                `;
            }).join('');
        }

        // 切换分类
        window.switchCategory = function(cat) {
            currentCategory = cat;
            currentPage = 1; // 切换分类时自动重置回第 1 页
            renderCategoryNav();
            renderPage();
        }

        // 渲染当前页面的卡片与分页
        function renderPage() {
            // 1. 过滤当前分类
            const filtered = currentCategory === '全部' 
                ? allDeals 
                : allDeals.filter(d => d.category === currentCategory);

            // 2. 分页计算
            const totalItems = filtered.length;
            const totalPages = Math.ceil(totalItems / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const pageData = filtered.slice(start, start + pageSize);

            // 3. 更新提示信息
            document.getElementById('pagination-info').innerHTML = `
                当前展示分类：<span class="text-blue-600 font-bold">${currentCategory}</span> 
                （共检索到 <span class="text-gray-900 font-bold">${totalItems}</span> 条活动）
            `;

            // 4. 渲染卡片列表
            const container = document.getElementById('deals-container');
            if (pageData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-20 bg-white rounded-xl shadow-sm border border-gray-100">
                        <p class="text-gray-500 font-medium">该分类下暂无进行中的活动</p>
                        <p class="text-xs text-gray-400 mt-1">您可以切换其他分类或查看“全部”</p>
                    </div>
                `;
                document.getElementById('pagination-nav').innerHTML = '';
                return;
            }

            container.innerHTML = pageData.map(deal => `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-2.5 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-md">📂 ${deal.category || '综合'}</span>
                            <span class="px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-semibold rounded-md">🏷️ ${deal.threshold_tag || '限时'}</span>
                        </div>
                        <h3 class="font-bold text-base text-gray-900 mb-2 leading-snug">${deal.title}</h3>
                        <p class="text-sm text-gray-600 mb-4 line-clamp-3">${deal.offer_detail || deal.value_desc || '暂无描述'}</p>
                    </div>
                    <div>
                        <div class="bg-gray-50 rounded-lg p-3 mb-4 text-xs space-y-1">
                            <div class="text-green-600 font-bold">💰 价值: ${deal.value_desc || '未标注'}</div>
                            <div class="text-gray-500">⏰ 截止: ${deal.end_date || '长期有效'}</div>
                        </div>
                        <div class="pt-3 border-t border-gray-100 flex justify-between items-center text-xs">
                            <span class="text-gray-400">来源: ${deal.source || '官方'}</span>
                            <a href="${deal.official_url}" target="_blank" class="px-3.5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold shadow-sm transition-colors">直达 →</a>
                        </div>
                    </div>
                </div>
            `).join('');

            // 5. 渲染分页栏
            renderPagination(totalPages);
        }

        // 渲染分页按钮
        function renderPagination(totalPages) {
            const nav = document.getElementById('pagination-nav');
            if (totalPages <= 1) {
                nav.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="px-3.5 py-2 bg-gray-100 text-gray-400 rounded-lg text-xs cursor-not-allowed"' : 'class="px-3.5 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-xs hover:bg-gray-50 font-medium"'}>
                    上一页
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += `<span class="px-3.5 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold shadow-sm">${i}</span>`;
                } else {
                    html += `<button onclick="changePage(${i})" class="px-3.5 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-xs hover:bg-gray-50 font-medium">${i}</button>`;
                }
            }

            html += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="px-3.5 py-2 bg-gray-100 text-gray-400 rounded-lg text-xs cursor-not-allowed"' : 'class="px-3.5 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-xs hover:bg-gray-50 font-medium"'}>
                    下一页
                </button>
            `;

            nav.innerHTML = html;
        }

        // 翻页动作
        window.changePage = function(page) {
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' }); // 翻页平滑滚动回顶部
        }

        document.addEventListener('DOMContentLoaded', initDealsPage);
    </script>
</body>
</html>
