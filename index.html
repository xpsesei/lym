<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球羊毛与高价值情报站 - 首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- 🌐 顶部多页面通用导航栏 -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div>
                <a href="index.html" class="text-xl font-bold text-blue-600 flex items-center gap-2">
                    🔥 全球羊毛与高价值情报站
                </a>
            </div>
            <!-- 多页面独立导航链接 -->
            <nav class="mt-3 md:mt-0 flex flex-wrap gap-2 text-xs font-semibold">
                <a href="index.html" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow-sm">首页</a>
                <a href="deals.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">全部情报</a>
                <a href="ai.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">🤖 AI优惠</a>
                <a href="crypto.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">💎 Crypto</a>
                <a href="vps.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">💻 VPS云服务</a>
                <a href="bank.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">🏦 U卡与银行</a>
                <a href="archive.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">📦 历史归档</a>
            </nav>
        </div>
    </header>

    <!-- 首页主要内容 -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-xl font-bold text-gray-900">🚀 最新收录情报</h2>
                <p class="text-xs text-gray-500 mt-0.5">这里仅展示最近更新的高价值精选活动</p>
            </div>
            <a href="deals.html" class="px-4 py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 text-xs font-semibold rounded-lg transition-colors">
                查看全部情报大厅 →
            </a>
        </div>

        <!-- 最新卡片容器（只显示前 6 条最新内容） -->
        <div id="latest-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-16 text-gray-400">
                <svg class="animate-spin h-8 w-8 mx-auto mb-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                正在加载最新内容...
            </div>
        </div>

        <div class="mt-12 text-center">
            <a href="deals.html" class="inline-block px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition-all text-sm">
                浏览全部历史情报与分类翻页 ➔
            </a>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-400">
        <p>Global Deals Auto Collector &copy; 2026 | Powered by GitHub Actions & DeepSeek AI</p>
    </footer>

    <!-- 首页逻辑脚本 -->
    <script>
        async function fetchLatestDeals() {
            const container = document.getElementById('latest-container');
            try {
                const response = await fetch('./data/active_deals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('网络请求失败');
                
                const deals = await response.json();
                
                if (!deals || deals.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-16 text-gray-500">暂无活动</div>';
                    return;
                }

                // 首页只取前 6 条最新的内容
                const latest = deals.slice(0, 6);

                container.innerHTML = latest.map(deal => `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="px-2.5 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-md">📂 ${deal.category || '综合'}</span>
                                <span class="px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-semibold rounded-md">🏷️ ${deal.threshold_tag || '限时'}</span>
                            </div>
                            <h3 class="font-bold text-base text-gray-900 mb-2 leading-snug">${deal.title}</h3>
                            <p class="text-sm text-gray-600 mb-4 line-clamp-3">${deal.offer_detail || deal.value_desc || '暂无描述'}</p>
                        </div>
                        <div>
                            <div class="bg-gray-50 rounded-lg p-3 mb-4 text-xs space-y-1">
                                <div class="text-green-600 font-bold">💰 价值: ${deal.value_desc || '未标注'}</div>
                                <div class="text-gray-500">⏰ 截止: ${deal.end_date || '长期有效'}</div>
                            </div>
                            <div class="pt-3 border-t border-gray-100 flex justify-between items-center text-xs">
                                <span class="text-gray-400">来源: ${deal.source || '官方'}</span>
                                <a href="${deal.official_url}" target="_blank" class="px-3.5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold shadow-sm">直达 →</a>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="col-span-full text-center py-16 text-red-500">数据加载失败</div>';
            }
        }
        document.addEventListener('DOMContentLoaded', fetchLatestDeals);
    </script>
</body>
</html>
