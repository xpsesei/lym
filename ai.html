<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 订阅与算力优惠 - 全球羊毛站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div><a href="index.html" class="text-xl font-bold text-blue-600 flex items-center gap-2">🔥 全球羊毛与高价值情报站</a></div>
            <nav class="mt-3 md:mt-0 flex flex-wrap gap-2 text-xs font-semibold">
                <a href="index.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600">首页</a>
                <a href="deals.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600">全部情报</a>
                <a href="ai.html" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white shadow-sm">🤖 AI优惠</a>
                <a href="crypto.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600">💎 Crypto</a>
                <a href="vps.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600">💻 VPS云服务</a>
                <a href="bank.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600">🏦 U卡与银行</a>
                <a href="archive.html" class="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-700 hover:bg-blue-50 hover:text-blue-600">📦 历史归档</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-6 flex justify-between items-center">
            <h2 id="page-title" class="text-xl font-bold text-gray-900">🤖 AI 订阅与算力优惠大厅</h2>
            <span id="page-count" class="text-xs bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">加载中...</span>
        </div>
        <div id="deals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-gray-400">正在加载数据...</div>
        </div>
        <div id="pagination-nav" class="mt-12 flex justify-center items-center space-x-2"></div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-400">
        <p>Global Deals Auto Collector &copy; 2026</p>
    </footer>

    <script>
        const TARGET_KEYWORD = 'AI订阅优惠';
        let allDeals = [], currentPage = 1;
        const pageSize = 9;

        async function initPage() {
            try {
                const res = await fetch('./data/active_deals.json?t=' + new Date().getTime());
                const deals = await res.json();
                allDeals = deals.filter(d => d.category && d.category.includes(TARGET_KEYWORD));
                renderPage();
            } catch (e) { document.getElementById('deals-container').innerHTML = '<div class="col-span-full text-center py-16 text-red-500">加载失败</div>'; }
        }

        function renderPage() {
            const total = allDeals.length, totalPages = Math.ceil(total / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            document.getElementById('page-count').innerText = `共 ${total} 条活动`;
            const pageData = allDeals.slice((currentPage - 1) * pageSize, currentPage * pageSize);
            const container = document.getElementById('deals-container');
            
            if (pageData.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-20 bg-white rounded-xl shadow-sm text-gray-400">暂无相关活动</div>';
                document.getElementById('pagination-nav').innerHTML = '';
                return;
            }

            container.innerHTML = pageData.map(deal => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="px-2.5 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-md">📂 ${deal.category}</span>
                            <span class="px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-semibold rounded-md">🏷️ ${deal.threshold_tag || '限时'}</span>
                        </div>
                        <h3 class="font-bold text-base text-gray-900 mb-2">${deal.title}</h3>
                        <p class="text-sm text-gray-600 mb-4 line-clamp-3">${deal.offer_detail || deal.value_desc}</p>
                    </div>
                    <div>
                        <div class="bg-gray-50 rounded-lg p-3 mb-4 text-xs space-y-1">
                            <div class="text-green-600 font-bold">💰 价值: ${deal.value_desc || '未标注'}</div>
                            <div class="text-gray-500">⏰ 截止: ${deal.end_date || '长期有效'}</div>
                        </div>
                        <a href="${deal.official_url}" target="_blank" class="block text-center py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700">直达 →</a>
                    </div>
                </div>
            `).join('');
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const nav = document.getElementById('pagination-nav');
            if (totalPages <= 1) { nav.innerHTML = ''; return; }
            let html = `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="px-3.5 py-2 bg-gray-100 text-gray-400 rounded-lg text-xs cursor-not-allowed"' : 'class="px-3.5 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-xs hover:bg-gray-50"'}>上一页</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += i === currentPage ? `<span class="px-3.5 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">${i}</span>` : `<button onclick="changePage(${i})" class="px-3.5 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-xs hover:bg-gray-50">${i}</button>`;
            }
            html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="px-3.5 py-2 bg-gray-100 text-gray-400 rounded-lg text-xs cursor-not-allowed"' : 'class="px-3.5 py-2 bg-white border border-gray-200 text-gray-700 rounded-lg text-xs hover:bg-gray-50"'}>下一页</button>`;
            nav.innerHTML = html;
        }

        window.changePage = function(p) { currentPage = p; renderPage(); window.scrollTo({top:0, behavior:'smooth'}); }
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
